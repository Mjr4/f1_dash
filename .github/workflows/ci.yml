name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: Aislamiento de la UI (data, sampling, panels, layout y service no importan Streamlit ni FastAPI)
        run: "! grep -rnE \"streamlit|fastapi\" src/f1_dash/data src/f1_dash/sampling src/f1_dash/panels src/f1_dash/layout src/f1_dash/service.py"
